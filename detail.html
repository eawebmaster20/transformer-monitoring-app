<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link href="assets/resources/datatables.min.css" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Serial Port Selector</title>
</head>
<body>
  <div class="container dark-mode">
  
    <div id="transformer" >
    </div>
     
    <p>Current: <span id="current">--</span></p>
    <p>Voltage: <span id="voltage">--</span></p>
    <p>Power: <span id="power">--</span></p>
    <p>Temperature: <span id="temp">--</span></p>
  </div>
  <script src="renderer.js"></script>
  <script src="assets/resources/datatables.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script>
    anime({
      targets: '#animated-rect',
      translateX: [0, 50], // Move 50px to the right
      translateY: [0, 30], // Move 30px down
      scale: [1, 1.2], // Scale up by 1.2x
      rotate: '1turn', // Rotate 360 degrees
      duration: 2000, // Animation duration in ms
      easing: 'easeInOutQuad',
      loop: true, // Infinite loop
      direction: 'alternate' 
    });
  </script>
</body>
</html>
